[package]
name = "seismic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "seismic"
path = "src/main.rs"
test = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ndarray = "0.16"
ndarray-npy = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
