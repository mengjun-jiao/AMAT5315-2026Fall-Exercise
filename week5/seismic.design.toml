usage = "seismic --experiment inputs/reflector.json --mode forward --every 3 --out artifacts/forward"
description = "simulate acoustic waves and their derivatives; no unstated defaults"

[args]
experiment = """
JSON experiment file containing:
- nx, nz: grid points along x and depth z
- dx, dt, steps: grid spacing, timestep, and number of time steps
- source_frequency: peak frequency f0 of the Ricker pulse
- source_peak_time: time t0 of the pulse peak
- source_amplitude: source strength
- shots: [x,z] grid index of each shot
- receivers: [x,z] grid index of each receiver
- sponge_width: sponge width in cells
- sponge_strength: largest damping at the edge
- background: wave speed c as a [z][x] array
- perturbation: velocity perturbation as a [z][x] array, used later by Born mode and by the forward recording's echo
- length_unit_m: metres per length unit
- time_unit_s: seconds per time unit
"""
mode = "forward: pressure traces; born: Born scattered data; adjoint: migrated image"
out = "output folder"

[writes]
stdout = "a header, then one tab-separated line per shot: shot, mode, data L2 norm"
"<out>/run.json" = "experiment_file: the experiment path; experiment: all experiment fields except background and perturbation"
"<out>/result.json" = "mode; nx; nz; dx; dt; steps; shots; receivers"
"<out>/traces.npy" = "forward: float64 pressures [shot, step, receiver]"
"<out>/born_data.npy" = "born: float64 scattered data [shot, step, receiver]"
"<out>/image.npy" = "adjoint: float64 velocity sensitivity [z, x]"

[args.recording]
every = "forward frame interval in steps from step 0, or adjoint reverse-step interval; default off"

[writes.recording]
"<out>/wavefield.npy" = "float32 frames of the first shot [frame, z, x]; forward: u^n after step n, n increasing; adjoint: adjoint of u^n after reversing step n, n decreasing"
"<out>/echo.npy" = "forward only; float32 frames of the first shot; background-plus-perturbation wavefield minus background wavefield; aligned with the wavefield recording frames"
"<out>/run.json" = "recording adds: every; steps; times = step*dt; one entry per recorded frame in frame order"

[args.reverse]
data = "born_data.npy of a born run: the receiver weights to back-propagate"

[writes.reverse]
"<out>/result.json" = "adjoint result later adds a statistics object containing: storage = \"full\"; checkpoints = null; reverse_calls; scheduler_forward_calls; peak_saved_states; peak_saved_bytes; per_shot statistics"

[args.checkpoint]
storage = "how adjoint keeps states: full (default) or treeverse"
checkpoints = "treeverse only: saved-state slots beyond the initial state"

[writes.checkpoint]
"<out>/actions-<shot>.json" = "one action entry per scheduler action, each containing action, step, and saved_states; saved_states counts saved complete states after the action, including s_0"
actions = "allowed actions are store (save working s_n in a new checkpoint slot), restore (copy saved s_n into the working state), call (advance working s_n to s_(n+1)), grad (reverse timestep n using saved input s_n), and fetch (free the slot holding s_n)"
invariants = "s_0 is saved from the start and never freed; grad steps N-1 through 0 occur exactly once in that order; after completion only s_0 remains saved"
statistics = "treeverse result statistics use storage = \"treeverse\"; checkpoints = requested additional-slot budget; retain reverse_calls, scheduler_forward_calls, peak_saved_states, and peak_saved_bytes; per_shot adds actions_file"
