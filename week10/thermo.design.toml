usage = "thermo --method boundary --l 64 --k 0.45 --chi 16 --out runs/boundary64"
description = "Compute the zero-field square Ising partition function; no unstated defaults."

[args]
l = "Side length of the square, at least 2"
k = "Inverse temperature K=1/T, with J=k_B=1 and K>=0"
chi = "Maximum retained bond dimension, at least 1"
out = "Directory for this run's raw evidence"
record = "full (default) stores reconstruction evidence; summary stores run metadata only"

[args.boundary]
method = "boundary: absorb rows with an MPS on an open square"

[writes]
evidence = "Model, geometry, settings, log Z, g=log(Z)/L^2, solver time; full mode also stores final tensors, normalization scales and truncation diagnostics."

[args.trg]
method = "trg: coarse-grain a periodic square; L must be a power of two"

[writes.trg]
evidence = "Full mode stores each step's scale, split factors and singular values, plus the final tensor."
