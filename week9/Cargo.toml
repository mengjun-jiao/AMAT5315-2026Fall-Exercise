[package]
name = "week9-infer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[[bin]]
name = "infer"
path = "src/main.rs"

[dependencies]
tenferro-tensor = "=0.9.0"
tenferro-cpu = { version = "=0.9.0", default-features = false, features = ["native"] }
tenferro-einsum = { version = "=0.9.0", default-features = false, features = ["native"] }
omeco = "=0.2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
anyhow = "1"
