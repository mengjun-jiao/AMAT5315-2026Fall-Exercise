[package]
name = "md"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

# Keep optimized machine code and full symbols for sampling profilers.
[profile.release]
opt-level = 3
debug = true
strip = false
